{{define "filters"}}
<form class="filters" method="get" id="filters-form">
  <label>Период
    <select id="period-select">
      <option value="all">Все</option>
      <option value="today">Сегодня</option>
    </select>
  </label>
  <label>Эксперимент
    <select name="experiment_id">
      <option value="" {{if not .Filter.ExperimentID}}selected{{end}}>все</option>
      {{range .Experiments}}
      <option value="{{.}}" {{if eq $.Filter.ExperimentID .}}selected{{end}}>{{.}}</option>
      {{end}}
    </select>
  </label>
  <label>Тикер <input name="ticker" value="{{.Filter.Ticker}}" placeholder="SBER"></label>
  <label>С <input type="date" name="date_from" id="date-from" value="{{.Filter.DateFrom}}"></label>
  <label>По <input type="date" name="date_to" id="date-to" value="{{.Filter.DateTo}}"></label>
  <button type="button" class="btn secondary" id="archive-btn" disabled>Архивировать</button>
  <button type="submit">Применить</button>
</form>

<div id="archive-comment-panel" class="archive-comment-panel" hidden>
  <div class="archive-comment-header">
    <span class="archive-comment-title" id="archive-comment-title"></span>
    <button type="button" class="btn archive-comment-toggle" id="archive-comment-toggle" aria-expanded="true">Свернуть</button>
  </div>
  <div class="archive-comment-body" id="archive-comment-body"></div>
</div>

<div class="modal-overlay" id="archive-modal" hidden>
  <div class="modal" role="dialog" aria-labelledby="archive-modal-title">
    <h2 id="archive-modal-title">Архивировать период</h2>
    <p class="muted" id="archive-modal-period"></p>
    <label class="modal-label">Комментарий
      <textarea id="archive-comment" rows="4" placeholder="Заметка к периоду…"></textarea>
    </label>
    <div class="modal-actions">
      <button type="button" class="btn" id="archive-cancel">Отмена</button>
      <button type="button" class="btn primary" id="archive-save">Сохранить</button>
    </div>
    <p class="modal-error muted" id="archive-error" hidden></p>
  </div>
</div>

<script>
(() => {
  const form = document.getElementById('filters-form');
  const periodSelect = document.getElementById('period-select');
  const dateFrom = document.getElementById('date-from');
  const dateTo = document.getElementById('date-to');
  const archiveBtn = document.getElementById('archive-btn');
  const modal = document.getElementById('archive-modal');
  const modalPeriod = document.getElementById('archive-modal-period');
  const commentInput = document.getElementById('archive-comment');
  const cancelBtn = document.getElementById('archive-cancel');
  const saveBtn = document.getElementById('archive-save');
  const errorEl = document.getElementById('archive-error');
  const commentPanel = document.getElementById('archive-comment-panel');
  const commentTitle = document.getElementById('archive-comment-title');
  const commentBody = document.getElementById('archive-comment-body');
  const commentToggle = document.getElementById('archive-comment-toggle');

  let archives = [];

  function todayISODate() {
    const now = new Date();
    const yyyy = now.getFullYear();
    const mm = String(now.getMonth() + 1).padStart(2, '0');
    const dd = String(now.getDate()).padStart(2, '0');
    return `${yyyy}-${mm}-${dd}`;
  }

  function findMatchingArchive() {
    return archives.find((a) => a.date_from === dateFrom.value && a.date_to === dateTo.value) || null;
  }

  function currentPeriodValue() {
    if (!dateFrom.value && !dateTo.value) {
      return 'all';
    }
    const today = todayISODate();
    if (dateFrom.value === today && dateTo.value === today) {
      return 'today';
    }
    return findMatchingArchive()?.id || '';
  }

  function setCommentExpanded(expanded) {
    commentBody.hidden = !expanded;
    commentToggle.textContent = expanded ? 'Свернуть' : 'Развернуть';
    commentToggle.setAttribute('aria-expanded', expanded ? 'true' : 'false');
  }

  function updateArchiveComment() {
    const archive = findMatchingArchive();
    if (!archive?.comment) {
      commentPanel.hidden = true;
      commentTitle.textContent = '';
      commentBody.textContent = '';
      return;
    }
    commentTitle.textContent = archive.name;
    commentBody.textContent = archive.comment;
    commentPanel.hidden = false;
    setCommentExpanded(true);
  }

  function updateArchiveBtn() {
    archiveBtn.disabled = !(dateFrom.value && dateTo.value);
  }

  function syncPeriodSelect() {
    const value = currentPeriodValue();
    if (value) {
      periodSelect.value = value;
      return;
    }
    // Произвольные даты С/По — без выбранного пресета.
    periodSelect.selectedIndex = -1;
  }

  function renderPeriodOptions() {
    const selected = currentPeriodValue() || periodSelect.value;
    periodSelect.innerHTML = '';

    const allOpt = document.createElement('option');
    allOpt.value = 'all';
    allOpt.textContent = 'Все';
    periodSelect.appendChild(allOpt);

    const todayOpt = document.createElement('option');
    todayOpt.value = 'today';
    todayOpt.textContent = 'Сегодня';
    periodSelect.appendChild(todayOpt);

    for (const a of archives) {
      const opt = document.createElement('option');
      opt.value = a.id;
      opt.textContent = a.name;
      periodSelect.appendChild(opt);
    }

    if (selected && [...periodSelect.options].some((o) => o.value === selected)) {
      periodSelect.value = selected;
    } else if (!dateFrom.value && !dateTo.value) {
      periodSelect.value = 'all';
    } else {
      periodSelect.selectedIndex = -1;
    }
    updateArchiveComment();
  }

  async function loadArchives() {
    const res = await fetch('/api/archives');
    if (!res.ok) {
      return;
    }
    archives = await res.json();
    renderPeriodOptions();
  }

  function openModal() {
    modalPeriod.textContent = dateFrom.value + ' — ' + dateTo.value;
    commentInput.value = '';
    errorEl.hidden = true;
    errorEl.textContent = '';
    modal.hidden = false;
    commentInput.focus();
  }

  function closeModal() {
    modal.hidden = true;
  }

  periodSelect.addEventListener('change', () => {
    const value = periodSelect.value;
    if (value === 'all') {
      dateFrom.value = '';
      dateTo.value = '';
      form.submit();
      return;
    }
    if (value === 'today') {
      const today = todayISODate();
      dateFrom.value = today;
      dateTo.value = today;
      form.submit();
      return;
    }
    const archive = archives.find((a) => a.id === value);
    if (!archive) {
      return;
    }
    dateFrom.value = archive.date_from;
    dateTo.value = archive.date_to;
    form.submit();
  });

  dateFrom.addEventListener('change', () => {
    updateArchiveBtn();
    syncPeriodSelect();
    updateArchiveComment();
  });
  dateTo.addEventListener('change', () => {
    updateArchiveBtn();
    syncPeriodSelect();
    updateArchiveComment();
  });

  commentToggle.addEventListener('click', () => {
    setCommentExpanded(commentBody.hidden);
  });

  archiveBtn.addEventListener('click', openModal);
  cancelBtn.addEventListener('click', closeModal);
  modal.addEventListener('click', (e) => {
    if (e.target === modal) {
      closeModal();
    }
  });

  saveBtn.addEventListener('click', async () => {
    errorEl.hidden = true;
    saveBtn.disabled = true;
    try {
      const res = await fetch('/api/archives', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          date_from: dateFrom.value,
          date_to: dateTo.value,
          comment: commentInput.value,
        }),
      });
      if (!res.ok) {
        const text = await res.text();
        errorEl.textContent = text || 'Ошибка сохранения';
        errorEl.hidden = false;
        return;
      }
      closeModal();
      await loadArchives();
    } catch (e) {
      errorEl.textContent = 'Ошибка: ' + e;
      errorEl.hidden = false;
    } finally {
      saveBtn.disabled = false;
    }
  });

  updateArchiveBtn();
  syncPeriodSelect();
  loadArchives();
})();
</script>
{{end}}
