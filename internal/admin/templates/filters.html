{{define "filters"}}
<form class="filters" method="get">
  <label>Эксперимент
    <select name="experiment_id">
      <option value="" {{if not .Filter.ExperimentID}}selected{{end}}>все</option>
      {{range .Experiments}}
      <option value="{{.}}" {{if eq $.Filter.ExperimentID .}}selected{{end}}>{{.}}</option>
      {{end}}
    </select>
  </label>
  <label>Тикер <input name="ticker" value="{{.Filter.Ticker}}" placeholder="SBER"></label>
  <label>С <input type="date" name="date_from" value="{{.Filter.DateFrom}}"></label>
  <label>По <input type="date" name="date_to" value="{{.Filter.DateTo}}"></label>
  <button type="submit">Применить</button>
</form>
{{end}}
