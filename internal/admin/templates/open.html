{{define "content"}}
<h1>{{.Title}}</h1>

<p class="muted">
  Живые открытые позиции из бота
  {{if .BotLiveURL}}(<code>{{.BotLiveURL}}</code>){{else}}(live URL не задан){{end}}.
  Обновление каждые 3 секунды.
</p>

<div id="open-status" class="open-status">Подключение…</div>

<div class="open-layout">
  <aside class="open-list">
    <h2>Позиции (<span id="open-count">0</span>)</h2>
    <div id="open-items"></div>
  </aside>
  <section class="open-chart-panel">
    <div class="open-chart-toolbar">
      <span id="open-chart-title">Выберите позицию</span>
      <span id="open-chart-meta" class="muted"></span>
    </div>
    <div id="open-chart"></div>
  </section>
</div>

<script src="https://unpkg.com/lightweight-charts@4.2.0/dist/lightweight-charts.standalone.production.js"></script>
<script src="/static/open-chart.js"></script>
{{end}}
