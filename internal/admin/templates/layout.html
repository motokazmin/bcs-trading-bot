{{define "layout.html"}}
<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{.Title}} — BCS Admin</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <header class="topbar">
    <div class="brand">BCS Trading Bot</div>
    <nav>
      <a href="/{{querySuffix .FilterQuery}}" class="{{if eq .ActiveNav "dashboard"}}active{{end}}">Дашборд</a>
      <a href="/trades{{querySuffix .FilterQuery}}" class="{{if eq .ActiveNav "trades"}}active{{end}}">Сделки</a>
      <a href="/export{{querySuffix .FilterQuery}}" class="{{if eq .ActiveNav "export"}}active{{end}}">Экспорт для ИИ</a>
    </nav>
  </header>
  <main class="container">
    {{template "content" .}}
  </main>
</body>
</html>
{{end}}
