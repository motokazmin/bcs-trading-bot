<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Открытые — BCS Admin</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body class="page-open" data-nav="open">
  <header class="topbar">
    <div class="brand">BCS Trading Bot</div>
    <nav>
      <a href="/">Дашборд</a>
      <a href="/open" class="active">Открытые</a>
      <a href="/trades">Сделки</a>
      <a href="/export">Экспорт для ИИ</a>
    </nav>
  </header>
  <main class="container">
    <h1>Открытые</h1>
    <p class="muted">Живые открытые позиции. Обновление каждые 3 секунды.</p>
    <div id="open-status" class="open-status">Подключение…</div>
    <div class="open-layout">
      <aside class="open-list">
        <h2>Позиции (<span id="open-count">0</span>)</h2>
        <div id="open-items"></div>
      </aside>
      <section class="open-chart-panel">
        <div class="open-chart-toolbar">
          <span id="open-chart-title">Выберите позицию</span>
          <span id="open-chart-meta" class="muted"></span>
        </div>
        <div id="open-chart"></div>
      </section>
    </div>
  </main>
  <script src="https://unpkg.com/lightweight-charts@4.2.0/dist/lightweight-charts.standalone.production.js"></script>
  <script src="/static/app.js"></script>
  <script src="/static/open-chart.js"></script>
</body>
</html>
