<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Сделки — BCS Admin</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body class="page-trades" data-nav="trades">
  <header class="topbar">
    <div class="brand">BCS Trading Bot</div>
    <nav>
      <a href="/">Дашборд</a>
      <a href="/open">Открытые</a>
      <a href="/trades" class="active">Сделки</a>
      <a href="/export">Экспорт для ИИ</a>
    </nav>
  </header>
  <main class="container">
    <h1>Сделки</h1>
    <div id="filters-root"></div>
    <p id="page-error" class="muted" hidden></p>
    <div id="pager-top"></div>
    <div class="table-scroll">
      <table class="data-table">
        <thead>
          <tr>
            <th class="num">№</th>
            <th>Эксп.</th><th>Тикер</th><th>Напр.</th>
            <th class="num">Лоты</th><th class="num">₽/лот</th><th class="num">Сумма</th>
            <th>Открыта</th><th>Закрыта</th><th>Удерж.</th>
            <th class="num">Цена вх.</th><th class="num">Цена вых.</th>
            <th class="num">PnL</th><th class="num">R</th>
            <th class="num">MFE</th><th class="num">MAE</th>
            <th class="num">Верх</th><th class="num">Низ</th>
            <th>Причина</th>
          </tr>
        </thead>
        <tbody id="trades-body"></tbody>
      </table>
    </div>
    <div id="pager-bottom"></div>
  </main>
  <script src="/static/app.js"></script>
  <script src="/static/filters.js"></script>
  <script src="/static/trades.js"></script>
</body>
</html>
