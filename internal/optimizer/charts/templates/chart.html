<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <title>{{.Title}}</title>
  <script src="https://unpkg.com/lightweight-charts@4.2.0/dist/lightweight-charts.standalone.production.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: system-ui, sans-serif; background: #1a1a2e; color: #e0e0e0; height: 100vh; display: flex; flex-direction: column; }
    header { padding: 12px 16px; border-bottom: 1px solid #333; flex-shrink: 0; }
    header h1 { font-size: 16px; font-weight: 600; }
    header p { font-size: 13px; color: #aaa; margin-top: 4px; }
    .stats { display: flex; flex-wrap: wrap; gap: 12px 20px; margin-top: 10px; }
    .stat { min-width: 90px; }
    .stat-label { font-size: 11px; color: #888; text-transform: uppercase; letter-spacing: 0.03em; }
    .stat-value { font-size: 15px; font-weight: 600; margin-top: 2px; }
    .stat-value.positive { color: #66bb6a; }
    .stat-value.negative { color: #e57373; }
    .stat-value.neutral { color: #e0e0e0; }
    .legend { display: flex; flex-wrap: wrap; gap: 12px 16px; margin-top: 8px; font-size: 12px; }
    .legend span::before { content: "● "; }
    .entry-long { color: #26a69a; }
    .entry-short { color: #ef5350; }
    .trade-line { color: #90caf9; }
    .exit-win { color: #66bb6a; }
    .exit-loss { color: #e57373; }
    .main { display: flex; flex: 1; min-height: 0; }
    .chart-wrap { flex: 1; min-width: 0; display: flex; flex-direction: column; border-right: 1px solid #333; }
    .chart-toolbar { display: flex; align-items: center; gap: 8px; padding: 8px 12px; border-bottom: 1px solid #2a2a4a; background: #16162a; }
    .chart-toolbar button {
      background: #2a2a4a; color: #e0e0e0; border: 1px solid #485c7b;
      border-radius: 6px; padding: 6px 12px; font-size: 13px; cursor: pointer;
    }
    .chart-toolbar button:hover { background: #3a3a5a; }
    .chart-toolbar button:disabled { opacity: 0.45; cursor: default; }
    .chart-toolbar .hint { font-size: 12px; color: #888; margin-left: 4px; }
    .crosshair-info {
      font-size: 13px; font-variant-numeric: tabular-nums; color: #cfd8dc;
      margin-left: auto; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
      min-width: 0; flex: 1; text-align: right;
    }
    .crosshair-info.empty { color: #666; }
    #chart { flex: 1; min-height: 0; width: 100%; }
    .trades-panel { width: 320px; flex-shrink: 0; display: flex; flex-direction: column; background: #16162a; }
    .trades-panel h2 {
      font-size: 13px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.04em;
      color: #aaa; padding: 12px 14px 8px; border-bottom: 1px solid #2a2a4a;
    }
    #trades-list { flex: 1; overflow-y: auto; padding: 8px; }
    .trade-item {
      width: 100%; text-align: left; background: #1a1a2e; border: 1px solid #2a2a4a;
      border-radius: 8px; padding: 10px 12px; margin-bottom: 8px; cursor: pointer; color: inherit;
    }
    .trade-item:hover { border-color: #485c7b; background: #20203a; }
    .trade-item.active { border-color: #90caf9; background: #23284a; box-shadow: 0 0 0 1px rgba(144, 202, 249, 0.25); }
    .trade-item-header { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
    .trade-num { font-weight: 700; font-size: 14px; }
    .trade-dir { font-size: 11px; font-weight: 600; padding: 2px 6px; border-radius: 4px; }
    .trade-dir.buy { background: rgba(38, 166, 154, 0.2); color: #26a69a; }
    .trade-dir.sell { background: rgba(239, 83, 80, 0.2); color: #ef5350; }
    .trade-pnl { font-weight: 700; font-size: 14px; }
    .trade-pnl.positive { color: #66bb6a; }
    .trade-pnl.negative { color: #e57373; }
    .trade-times, .trade-prices { font-size: 12px; color: #aaa; margin-top: 6px; line-height: 1.4; }
    .trade-prices { color: #ccc; }
    .trade-close-reason {
      display: inline-block; margin-top: 6px; font-size: 11px; font-weight: 600;
      padding: 2px 6px; border-radius: 4px; background: rgba(144, 202, 249, 0.15); color: #90caf9;
    }
    .trades-empty { padding: 16px; color: #888; font-size: 13px; text-align: center; }
  </style>
</head>
<body>
  <header>
    <h1>{{.Title}}</h1>
    <p>{{.Subtitle}}</p>
    <div class="stats">
      {{range .Stats}}
      <div class="stat">
        <div class="stat-label">{{.Label}}</div>
        <div class="stat-value {{.Class}}">{{.Value}}</div>
      </div>
      {{end}}
    </div>
    <div class="legend">
      <span class="entry-long">▲ N ВХ — вход long</span>
      <span class="entry-short">▼ N ВХ — вход short</span>
      <span class="trade-line">--- пунктир — сделка (вход→выход)</span>
      <span class="exit-win">■ N ВЫХ — выход (SL / TP / EOD)</span>
    </div>
  </header>
  <div class="main">
    <div class="chart-wrap">
      <div class="chart-toolbar">
        <button id="reset-zoom" type="button" disabled>Исходный масштаб</button>
        <span class="hint">Клик по сделке — зум по барам (±14 свечей контекста)</span>
        <span id="crosshair-info" class="crosshair-info empty">—</span>
      </div>
      <div id="chart"></div>
    </div>
    <aside class="trades-panel">
      <h2>Сделки (<span id="trades-count">0</span>)</h2>
      <div id="trades-list"></div>
    </aside>
  </div>
  <script>
    const payload = __CHART_DATA__;
    const chartEl = document.getElementById('chart');
    const resetBtn = document.getElementById('reset-zoom');
    const tradesList = document.getElementById('trades-list');
    const tradesCount = document.getElementById('trades-count');
    const crosshairInfo = document.getElementById('crosshair-info');
    let selectedTradeIndex = null;

    const MSK = 'Europe/Moscow';

    function chartTimeToUnix(time) {
      if (typeof time === 'number') return time;
      if (time && typeof time === 'object' && 'timestamp' in time) return time.timestamp;
      return 0;
    }

    function formatMSKDateTime(timestamp) {
      return new Date(timestamp * 1000).toLocaleString('ru-RU', {
        timeZone: MSK,
        day: '2-digit',
        month: '2-digit',
        year: 'numeric',
        hour: '2-digit',
        minute: '2-digit',
        hour12: false,
      });
    }

    function formatMSKTime(timestamp) {
      return new Date(timestamp * 1000).toLocaleTimeString('ru-RU', {
        timeZone: MSK,
        hour: '2-digit',
        minute: '2-digit',
        hour12: false,
      });
    }

    function formatMSKTick(time, tickMarkType) {
      const ts = chartTimeToUnix(time);
      const d = new Date(ts * 1000);
      switch (tickMarkType) {
        case LightweightCharts.TickMarkType.Year:
          return d.toLocaleDateString('ru-RU', { timeZone: MSK, year: 'numeric' });
        case LightweightCharts.TickMarkType.Month:
          return d.toLocaleDateString('ru-RU', { timeZone: MSK, month: 'short' });
        case LightweightCharts.TickMarkType.DayOfMonth:
          return d.toLocaleDateString('ru-RU', { timeZone: MSK, day: 'numeric', month: 'short' });
        default:
          return formatMSKTime(ts);
      }
    }

    const chart = LightweightCharts.createChart(chartEl, {
      layout: { background: { color: '#1a1a2e' }, textColor: '#d1d4dc' },
      grid: { vertLines: { color: '#2a2a4a' }, horzLines: { color: '#2a2a4a' } },
      crosshair: { mode: LightweightCharts.CrosshairMode.Normal },
      rightPriceScale: { borderColor: '#485c7b', autoScale: true, scaleMargins: { top: 0.08, bottom: 0.08 } },
      timeScale: {
        borderColor: '#485c7b',
        timeVisible: true,
        secondsVisible: false,
        tickMarkFormatter: formatMSKTick,
      },
      localization: {
        locale: 'ru-RU',
        timeFormatter: (time) => formatMSKTime(chartTimeToUnix(time)),
        dateFormat: 'dd.MM.yyyy',
      },
    });

    const tradeLines = [];
    payload.trades.forEach((tr) => {
      const color = tr.pnl >= 0 ? 'rgba(102, 187, 106, 0.9)' : 'rgba(229, 115, 115, 0.9)';
      const line = chart.addLineSeries({
        color,
        lineWidth: 2,
        lineStyle: LightweightCharts.LineStyle.Dashed,
        priceLineVisible: false,
        lastValueVisible: false,
        crosshairMarkerVisible: true,
      });
      line.setData([
        { time: tr.entryTime, value: tr.entryPrice },
        { time: tr.exitTime, value: tr.exitPrice },
      ]);
      tradeLines.push(line);
    });

    const candles = chart.addCandlestickSeries({
      upColor: '#26a69a',
      downColor: '#ef5350',
      borderVisible: false,
      wickUpColor: '#26a69a',
      wickDownColor: '#ef5350',
    });
    candles.setData(payload.candles);
    candles.setMarkers(payload.markers);

    function formatPrice(value) {
      return Number(value).toFixed(2);
    }

    function clearCrosshairInfo() {
      crosshairInfo.textContent = '—';
      crosshairInfo.classList.add('empty');
    }

    function setCrosshairInfo(text) {
      crosshairInfo.textContent = text;
      crosshairInfo.classList.remove('empty');
    }

    chart.subscribeCrosshairMove((param) => {
      if (!param.time) {
        clearCrosshairInfo();
        return;
      }
      const ts = chartTimeToUnix(param.time);
      const candleData = param.seriesData.get(candles);
      if (!candleData) {
        setCrosshairInfo(formatMSKDateTime(ts));
        return;
      }
      setCrosshairInfo(
        `${formatMSKDateTime(ts)} · O ${formatPrice(candleData.open)} `
        + `H ${formatPrice(candleData.high)} L ${formatPrice(candleData.low)} `
        + `C ${formatPrice(candleData.close)}`,
      );
    });

    const defaultScaleMargins = { top: 0.08, bottom: 0.08 };
    const zoomScaleMargins = { top: 0.04, bottom: 0.04 };
    const BAR_PADDING = 14;
    let baselineLogicalRange = null;

    function findFirstBarAtOrAfter(time) {
      let lo = 0;
      let hi = payload.candles.length;
      while (lo < hi) {
        const mid = (lo + hi) >> 1;
        if (payload.candles[mid].time < time) lo = mid + 1;
        else hi = mid;
      }
      return Math.min(lo, payload.candles.length - 1);
    }

    function findLastBarAtOrBefore(time) {
      let lo = 0;
      let hi = payload.candles.length;
      while (lo < hi) {
        const mid = (lo + hi) >> 1;
        if (payload.candles[mid].time <= time) lo = mid + 1;
        else hi = mid;
      }
      return Math.max(lo - 1, 0);
    }

    function tradeLogicalRange(tr) {
      if (!payload.candles.length) {
        return { from: 0, to: 0 };
      }
      const entryIdx = findFirstBarAtOrAfter(tr.entryTime);
      const exitIdx = findLastBarAtOrBefore(tr.exitTime);
      const fromIdx = Math.max(0, Math.min(entryIdx, exitIdx) - BAR_PADDING);
      const toIdx = Math.min(payload.candles.length - 1, Math.max(entryIdx, exitIdx) + BAR_PADDING);
      return { from: fromIdx - 0.5, to: toIdx + 0.5 };
    }

    function priceRangeForBars(fromIdx, toIdx, tr) {
      let min = Math.min(tr.entryPrice, tr.exitPrice);
      let max = Math.max(tr.entryPrice, tr.exitPrice);
      const start = Math.max(0, Math.floor(fromIdx));
      const end = Math.min(payload.candles.length - 1, Math.ceil(toIdx));
      for (let i = start; i <= end; i++) {
        const c = payload.candles[i];
        min = Math.min(min, c.low);
        max = Math.max(max, c.high);
      }
      const spread = Math.max(max - min, min * 0.0005);
      const pad = spread * 0.06;
      return { from: min - pad, to: max + pad };
    }

    function makeWindowAutoscale(range) {
      return () => ({
        priceRange: { minValue: range.from, maxValue: range.to },
        margins: { above: 6, below: 6 },
      });
    }

    function applyTradeZoom(tr) {
      const logicalRange = tradeLogicalRange(tr);
      const priceRange = priceRangeForBars(logicalRange.from, logicalRange.to, tr);
      const provider = makeWindowAutoscale(priceRange);

      chart.timeScale().setVisibleLogicalRange(logicalRange);
      chart.priceScale('right').applyOptions({
        autoScale: true,
        scaleMargins: zoomScaleMargins,
      });
      candles.applyOptions({ autoscaleInfoProvider: provider });
      tradeLines.forEach((line) => line.applyOptions({ autoscaleInfoProvider: () => null }));
    }

    function clearTradeZoom() {
      candles.applyOptions({ autoscaleInfoProvider: (original) => original() });
      tradeLines.forEach((line) => line.applyOptions({ autoscaleInfoProvider: (original) => original() }));
      chart.priceScale('right').applyOptions({
        autoScale: true,
        scaleMargins: defaultScaleMargins,
      });
    }

    function saveBaselineView() {
      chart.timeScale().fitContent();
      baselineLogicalRange = chart.timeScale().getVisibleLogicalRange();
    }

    function fitChart() {
      clearTradeZoom();
      if (baselineLogicalRange) {
        chart.timeScale().setVisibleLogicalRange(baselineLogicalRange);
      } else {
        chart.timeScale().fitContent();
      }
      requestAnimationFrame(() => {
        clearTradeZoom();
        if (baselineLogicalRange) {
          chart.timeScale().setVisibleLogicalRange({ ...baselineLogicalRange });
        } else {
          chart.timeScale().fitContent();
        }
      });
    }

    function zoomToTrade(tr) {
      applyTradeZoom(tr);
      resetBtn.disabled = false;
    }

    function setSelectedTrade(index) {
      selectedTradeIndex = index;
      tradesList.querySelectorAll('.trade-item').forEach((el) => {
        el.classList.toggle('active', Number(el.dataset.index) === index);
      });
    }

    function renderTrades() {
      tradesCount.textContent = String(payload.trades.length);
      if (!payload.trades.length) {
        tradesList.innerHTML = '<div class="trades-empty">Нет сделок</div>';
        return;
      }

      tradesList.innerHTML = payload.trades.map((tr) => {
        const dirClass = tr.direction === 'BUY' ? 'buy' : 'sell';
        const pnlClass = tr.pnl >= 0 ? 'positive' : 'negative';
        const pnlText = `${tr.pnl >= 0 ? '+' : ''}${Math.round(tr.pnl)} ₽`;
        return `
          <button type="button" class="trade-item" data-index="${tr.index}">
            <div class="trade-item-header">
              <span>
                <span class="trade-num">#${tr.index}</span>
                <span class="trade-dir ${dirClass}">${tr.direction}</span>
              </span>
              <span class="trade-pnl ${pnlClass}">${pnlText}</span>
            </div>
            <div class="trade-times">${tr.entryLabel} → ${tr.exitLabel}</div>
            <div class="trade-prices">${tr.entryPrice.toFixed(2)} → ${tr.exitPrice.toFixed(2)}</div>
            <span class="trade-close-reason">${tr.closeReasonLabel}</span>
          </button>
        `;
      }).join('');

      tradesList.querySelectorAll('.trade-item').forEach((el) => {
        el.addEventListener('click', () => {
          const index = Number(el.dataset.index);
          const tr = payload.trades.find((t) => t.index === index);
          if (!tr) return;
          setSelectedTrade(index);
          zoomToTrade(tr);
        });
      });
    }

    resetBtn.addEventListener('click', () => {
      fitChart();
      setSelectedTrade(null);
      resetBtn.disabled = true;
    });

    renderTrades();
    saveBaselineView();

    const resizeChart = () => {
      chart.applyOptions({
        width: chartEl.clientWidth,
        height: chartEl.clientHeight,
      });
      if (!selectedTradeIndex) {
        saveBaselineView();
      }
    };
    window.addEventListener('resize', resizeChart);
    resizeChart();
  </script>
</body>
</html>
