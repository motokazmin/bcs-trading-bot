# Champion — Morning Session ORC (07:00–09:50 MSK).
# Portfolio: configs/runs/portfolio-paper.yaml · docs/portfolio.md
trading_mode: virtual

tickers:
  - ROSN
  - NVTK
  - MOEX
  - CHMF
  - TATN
  - SBER

class_code: TQBR
candle_timeframe: M5

costs:
  commission_rate_per_leg: 0.00008
  # Проскальзывание + половина спреда на КАЖДОЙ ноге. 1 б.п. — консервативно-мягкая
  # оценка для ликвидных TQBR. Для стратегий со входом лимитом на уровне (ORC) вход
  # так оценивается с запасом: лимит не проскальзывает, он либо исполняется, либо нет.
  # Стресс без правки конфига: portfolio-backtest -slippage-bps N
  slippage_bps: 1

session:
  timezone: Europe/Moscow
  session_open_time: "07:00"
  eod_close_time: "09:50"
  entry_delay_minutes: 0
  weekdays_only: true

strategy:
  type: session_orc
  stop_mode: atr
  atr_period: 14
  atr_multiplier: 0.8930746929599627
  breakout_threshold: 0.0037667883833940297
  orb_minutes: 14
  reward_ratio: 1.6671892216849793
  trail_activation_r: 1.0664818788974488
  trail_breakeven_r: 0.04905400993316018
  trail_stage_max: 3
  max_trades_per_ticker_per_day: 1

  # Порог по стоимости сделки, не подгонка: комиссия 1.6 б.п. round-trip плюс
  # спред 1–5 б.п. Стоп в 20 б.п. — примерно 10x издержек. Ужесточать только
  # по новым данным (docs/analysis/state.md), а не по этим 95 сделкам.
  min_stop_bps: 20
  # Фикс. тейк резал победителей (18/18 сделок шли дальше). Выход — трейлинг.
  take_profit_enabled: false
risk:
  deposit: 200000
  max_daily_loss_percent: 2.0
  risk_per_trade_percent: 0.5
  max_parallel_trades: 5

virtual:
  balance: 200000
