# Paper trading: фьючерсы MOEX.
# Запуск: go run ./cmd/bot -config configs/runs/virtual-futures.yaml

trading_mode: virtual

tickers:
  - ticker: SRH6
    step_price_value: 1.2
  - GAZR

class_code: SPBFUT
candle_timeframe: M5

costs:
  commission_per_lot: 5.0
  # Проскальзывание + половина спреда на КАЖДОЙ ноге. 1 б.п. — консервативно-мягкая
  # оценка для ликвидных TQBR. Для стратегий со входом лимитом на уровне (ORC) вход
  # так оценивается с запасом: лимит не проскальзывает, он либо исполняется, либо нет.
  # Стресс без правки конфига: portfolio-backtest -slippage-bps N
  slippage_bps: 1

risk:
  deposit: 500000
  max_daily_loss_percent: 2
  risk_per_trade_percent: 0.5

strategy:
  lookback: 20

virtual:
  balance: 500000

session:
  timezone: Europe/Moscow
  eod_close_time: "23:40"      # вечерняя сессия фьючерсов
  session_open_time: "10:00"
