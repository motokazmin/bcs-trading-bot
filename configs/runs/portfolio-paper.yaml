# Paper portfolio: 6 слотов на одном virtual-счёте 200k.
# Каждый слот (experiment) — одна стратегия на общем счёте (депозит, CB,
# one-position-per-ticker). Граница движок/стратегия: docs/0001-engine-strategy-boundary.md.
# docs/portfolio.md · docs/baseline.md · docs/strategies.md · docs/research-rolling.md
# Запуск: make bot
# Проверка: go run ./cmd/optimizer portfolio-backtest -config configs/runs/portfolio-paper.yaml

trading_mode: virtual

tickers:
  - MGNT
  - ROSN
  - TATN
  - LKOH
  - CHMF
  - MOEX
  - AFKS
  - NVTK
  - GAZP
  - SBER

class_code: TQBR
candle_timeframe: M5

# `min_stop_bps: 20` в каждом слоте — гейт по стоимости сделки, не подгонка: комиссия
# 1.6 б.п. round-trip плюс спред 1–5 б.п., то есть стоп в 20 б.п. ≈ 10x издержек.
# Портфельный бэктест 2024-07→2026-09: сделок 1829→1171, exp_R +0.440→+0.423
# (в рублях на сделку +383→+385), max_dd 15720→12978 — режет объём, не качество.
# Ключ обязан совпадать с configs/champions/*; однажды он туда не доехал и полтора
# месяца не работал в live. Разбор: docs/analysis/0002-live-config-drift-and-cash-sizing.md
#
# `take_profit_enabled: false` из ORC-чемпионов сюда НЕ переносить без переподбора
# блока выхода: на том же бэктесте exp_R +0.440→+0.342, PF 2.08→1.72.

costs:
  commission_rate_per_leg: 0.00008
  # Проскальзывание + половина спреда на КАЖДОЙ ноге. 1 б.п. — консервативно-мягкая
  # оценка для ликвидных TQBR. Для стратегий со входом лимитом на уровне (ORC) вход
  # так оценивается с запасом: лимит не проскальзывает, он либо исполняется, либо нет.
  # Стресс без правки конфига: portfolio-backtest -slippage-bps N
  slippage_bps: 1

risk:
  deposit: 200000
  max_daily_loss_percent: 2.0
  # Инвариант: кап по кэшу не срабатывает, пока risk_per_trade_percent <= min_stop_bps/100.
  # notional = (deposit * r/100) / stop_frac, и при stop_bps >= min_stop_bps он влезает
  # в депозит ровно при этом условии. Гейт 20 б.п. => предел 0.20. Проверено развёрткой:
  # при 0.5 кап съедал 15.1% прибыли, при 0.2 — 0.4%; при гейте 30 плато уезжает на 0.30.
  # Цена честного сайзинга (2024-07→2026-09): net_pnl 450957 -> 211812, max_dd 12978 -> 5444,
  # exp_R и PF не меняются. Поднимать вместе с min_stop_bps, не по отдельности.
  risk_per_trade_percent: 0.20
  max_parallel_trades: 5

virtual:
  balance: 200000

# Корневая сессия — fallback для main-слотов; morning/evening override в experiment.
session:
  timezone: Europe/Moscow
  eod_close_time: "18:40"
  session_open_time: "10:00"

storage:
  path: data/trades.db

experiments:
  - id: session-orc-morning
    name: "Morning Session ORC (07:00–09:50)"
    session_open_time: "07:00"
    eod_close_time: "09:50"
    weekdays_only: true
    tickers:
      - ROSN
      - NVTK
      - MOEX
      - CHMF
      - TATN
      - SBER
    strategy:
      type: session_orc
      stop_mode: atr
      atr_period: 14
      atr_multiplier: 0.8930746929599627
      breakout_threshold: 0.0037667883833940297
      orb_minutes: 14
      reward_ratio: 1.6671892216849793
      trail_activation_r: 1.0664818788974488
      trail_breakeven_r: 0.04905400993316018
      trail_stage_max: 3
      max_trades_per_ticker_per_day: 1
      min_stop_bps: 20      # гейт по издержкам, см. шапку файла

  - id: orc-wave2
    name: "ORC Champion (10:00–10:30)"
    tickers:
      - MGNT
      - ROSN
      - TATN
    strategy:
      type: opening_range_continuation
      stop_mode: atr
      atr_period: 14
      orb_minutes: 15
      atr_multiplier: 0.841239838255675
      breakout_threshold: 0.008381572367285477
      reward_ratio: 1.6410674740062587
      trail_activation_r: 1.5150736483279235
      trail_breakeven_r: 0.01394552332498874
      trail_stage_max: 1
      max_trades_per_ticker_per_day: 1
      min_stop_bps: 20      # гейт по издержкам, см. шапку файла

  - id: orc-complement
    name: "ORC Complement rolling (excl. MGNT/ROSN/TATN)"
    tickers:
      - SBER
      - GAZP
      - LKOH
      - NVTK
      - CHMF
      - MOEX
      - AFKS
    strategy:
      type: opening_range_continuation
      stop_mode: atr
      atr_period: 14
      orb_minutes: 22
      atr_multiplier: 0.8255005415774227
      breakout_threshold: 0.0038093119295890838
      reward_ratio: 1.6410674740062587
      trail_activation_r: 1.5150736483279235
      trail_breakeven_r: 0.01394552332498874
      trail_stage_max: 1
      max_trades_per_ticker_per_day: 1
      allow_all_tickers: true
      min_stop_bps: 20      # гейт по издержкам, см. шапку файла

  - id: or-fade-conservative
    name: "OR Fade Champion (10:15–12:30)"
    tickers:
      - LKOH
      - CHMF
      - MOEX
      - AFKS
    strategy:
      type: opening_range_fade
      stop_mode: atr
      atr_period: 14
      orb_minutes: 26
      breakout_threshold: 0.0034895165897401237
      fade_window_minutes: 52
      fade_trade_end_minutes: 106
      require_inside_range: false
      atr_multiplier: 1.2317886975190864
      reward_ratio: 1.2709535081206467
      trail_activation_r: 2.0039286981203337
      trail_breakeven_r: 0.017723090353826982
      trail_stage_max: 3
      max_trades_per_ticker_per_day: 2
      min_stop_bps: 20      # гейт по издержкам, см. шапку файла

  - id: mf-afternoon
    name: "MF Afternoon Champion (12:30–18:40)"
    entry_delay_minutes: 150
    tickers:
      - MGNT
      - TATN
    strategy:
      type: momentum_filtered
      stop_mode: atr
      atr_period: 14
      lookback: 39
      breakout_threshold: 0.007659168048723002
      reward_ratio: 1.3941295334576287
      volume_filter: false
      volume_min_ratio: 1.2806021030773282
      long_only: true
      trend_sma_period: 37
      strategy_entry_delay_minutes: 26
      atr_multiplier: 2.656226764423858
      trail_activation_r: 2.517382593826568
      trail_discrete_step_r: 0.29059433907203625
      trail_stage_max: 2
      max_trades_per_ticker_per_day: 2
      min_stop_bps: 20      # гейт по издержкам, см. шапку файла

  - id: session-orc-evening
    name: "Evening Session ORC (19:05–23:50)"
    session_open_time: "19:05"
    eod_close_time: "23:50"
    weekdays_only: true
    tickers:
      - NVTK
      - GAZP
      - ROSN
      - CHMF
      - MOEX
      - TATN
      - MGNT
    strategy:
      type: session_orc
      stop_mode: atr
      atr_period: 14
      atr_multiplier: 1.2098351152997484
