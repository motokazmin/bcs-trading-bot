# Paper trading: три FROZEN champion-стратегии в одном процессе.
# Слоты не пересекаются по времени; MGNT/TATN в ORC (утро) и MF (день).
#
# Запуск: go run ./cmd/bot -config configs/runs/portfolio-paper.yaml
#
# Champion snapshots: configs/champions/*.yaml

trading_mode: virtual

tickers:
  - MGNT
  - ROSN
  - TATN
  - LKOH
  - CHMF
  - MOEX

class_code: TQBR
candle_timeframe: M5

costs:
  commission_per_lot: 0.10

session:
  timezone: Europe/Moscow
  eod_close_time: "18:40"
  session_open_time: "10:00"

storage:
  path: data/trades.db

experiments:
  - id: orc-wave2
    name: "ORC Champion (10:00–10:30)"
    tickers:
      - MGNT
      - ROSN
      - TATN
    strategy:
      type: opening_range_continuation
      stop_mode: atr
      atr_period: 14
      orb_minutes: 13
      atr_multiplier: 0.83
      breakout_threshold: 0.0086
      reward_ratio: 1.47
      trail_activation_r: 2.04
      trail_stage_max: 2
      trail_breakeven_r: 0.028
      max_trades_per_ticker_per_day: 2
    risk:
      deposit: 200000
      max_daily_loss_percent: 2.0
      risk_per_trade_percent: 0.5
      max_parallel_trades: 2
    virtual:
      balance: 200000

  - id: or-fade-conservative
    name: "OR Fade Champion (10:15–12:30)"
    tickers:
      - LKOH
      - CHMF
      - MOEX
    strategy:
      type: opening_range_fade
      stop_mode: atr
      atr_period: 14
      orb_minutes: 16
      breakout_threshold: 0.002762422828227384
      fade_window_minutes: 13
      fade_trade_end_minutes: 77
      require_inside_range: true
      atr_multiplier: 1.9772193466876373
      reward_ratio: 1.1900341423998035
      trail_activation_r: 2.3617199866716763
      trail_breakeven_r: 0.036
      trail_stage_max: 3
      max_trades_per_ticker_per_day: 3
    risk:
      deposit: 200000
      max_daily_loss_percent: 2.0
      risk_per_trade_percent: 0.5
      max_parallel_trades: 2
    virtual:
      balance: 200000

  - id: mf-afternoon
    name: "MF Afternoon Champion (12:30–18:40)"
    entry_delay_minutes: 150
    tickers:
      - MGNT
      - TATN
    strategy:
      type: momentum_filtered
      stop_mode: atr
      atr_period: 14
      lookback: 37
      breakout_threshold: 0.009417073737837274
      reward_ratio: 1.9026308021374099
      volume_filter: false
      long_only: true
      trend_sma_period: 32
      strategy_entry_delay_minutes: 21
      atr_multiplier: 2.1908875571737174
      trail_activation_r: 2.1542158180746154
      trail_discrete_step_r: 0.33896654497213896
      trail_stage_max: 5
      max_trades_per_ticker_per_day: 1
    risk:
      deposit: 200000
      max_daily_loss_percent: 2.0
      risk_per_trade_percent: 0.5
      max_parallel_trades: 2
    virtual:
      balance: 200000
