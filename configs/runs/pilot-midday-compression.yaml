# Пилот Фазы 3 (ADR 0001): Midday Compression Breakout через новый
# StrategyRunner/adapter.SelfManagedStrategy вместо TickerWorker.
# Сигнальная логика идентична configs/strategies/midday-compression-breakout.yaml
# — меняется только то, кто ведёт SL/TP/трейлинг/EOD/сайзинг (сама стратегия,
# не движок). Изолированный счёт (своя БД), чтобы не путать со старым
# прогоном той же стратегии на TickerWorker, если он тоже запущен.
trading_mode: virtual

tickers:
  - ticker: LKOH
    step_price_value: 1.0
  - ticker: MOEX
    step_price_value: 1.0

class_code: TQBR
candle_timeframe: M5
runtime: strategy

costs:
  commission_rate_per_leg: 0.00008

session:
  timezone: Europe/Moscow
  session_open_time: "10:00"
  eod_close_time: "18:40"
  entry_delay_minutes: 0

strategy:
  type: midday_compression_breakout
  stop_mode: atr
  lookback: 6
  atr_period: 14
  atr_bars: 6
  compression_percentile: 40
  entry_end_minutes: 210
  atr_multiplier: 1.5
  reward_ratio: 2.25
  volume_filter: true
  volume_min_ratio: 1.5
  breakout_threshold: 0.0
  max_trades_per_ticker_per_day: 2

risk:
  deposit: 200000
  max_daily_loss_percent: 2.0
  risk_per_trade_percent: 0.5
  max_parallel_trades: 2

virtual:
  balance: 200000

storage:
  enabled: true
  path: data/trades-pilot-midday-compression.db
