# Session OR Fade — вечерняя сессия 19:05–23:50.
trading_mode: virtual

class_code: TQBR
candle_timeframe: M5

costs:
  commission_rate_per_leg: 0.00008

session:
  timezone: Europe/Moscow
  session_open_time: "07:00"
  eod_close_time: "09:50"
  entry_delay_minutes: 0
  weekdays_only: true

strategy:
  type: session_or_fade
  stop_mode: atr
  atr_period: 14
  atr_multiplier: 1.0
  orb_minutes: 20
  breakout_threshold: 0.004
  fade_window_minutes: 45
  fade_trade_end_minutes: 150
  require_inside_range: false
  reward_ratio: 1.4
  trail_activation_r: 1.2
  trail_stage_max: 2
  trail_breakeven_r: 0.02
  max_trades_per_ticker_per_day: 1

search_space:
  strategy: session_or_fade
  parameters:
    orbMinutes:
      type: int
      min: 10
      max: 30
    breakoutThreshold:
      type: float
      min: 0.002
      max: 0.01
    fadeWindowMinutes:
      type: int
      min: 20
      max: 90
    fadeTradeEndMinutes:
      type: int
      min: 60
      max: 240
    rewardRatio:
      type: float
      min: 1.1
      max: 2.0
    atrMultiplier:
      type: float
      min: 0.7
      max: 1.6
    trailActivationR:
      type: float
      min: 0.8
      max: 2.0
    trailStageMax:
      type: int
      min: 1
      max: 3
    trailBreakevenR:
      type: float
      min: 0.0
      max: 0.15
    maxEntriesPerTickerPerDay:
      type: int
      min: 1
      max: 2
  fixed:
    riskPerTradePercent: 0.5
    dailyLossLimitPercent: 2.0
    maxParallelTrades: 5
    requireInsideRange: 0

risk:
  deposit: 200000
  max_daily_loss_percent: 2.0
  risk_per_trade_percent: 0.5
  max_parallel_trades: 5

virtual:
  balance: 200000
