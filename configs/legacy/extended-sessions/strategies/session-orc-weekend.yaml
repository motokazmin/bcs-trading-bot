# Session ORC — вечерняя сессия 19:05–23:50 (без hardcoded whitelist).
trading_mode: virtual

class_code: TQBR
candle_timeframe: M5

costs:
  commission_rate_per_leg: 0.00008

session:
  timezone: Europe/Moscow
  session_open_time: "10:00"
  eod_close_time: "19:00"
  entry_delay_minutes: 0
  weekend_only: true

strategy:
  type: session_orc
  stop_mode: atr
  atr_period: 14
  atr_multiplier: 0.9
  orb_minutes: 15
  breakout_threshold: 0.006
  reward_ratio: 1.6
  trail_activation_r: 1.5
  trail_stage_max: 1
  trail_breakeven_r: 0.02
  max_trades_per_ticker_per_day: 1

search_space:
  strategy: session_orc
  parameters:
    orbMinutes:
      type: int
      min: 10
      max: 25
    breakoutThreshold:
      type: float
      min: 0.002
      max: 0.012
    rewardRatio:
      type: float
      min: 1.2
      max: 2.2
    atrMultiplier:
      type: float
      min: 0.7
      max: 1.5
    trailActivationR:
      type: float
      min: 1.0
      max: 2.2
    trailStageMax:
      type: int
      min: 1
      max: 3
    trailBreakevenR:
      type: float
      min: 0.0
      max: 0.15
    maxEntriesPerTickerPerDay:
      type: int
      min: 1
      max: 2
  fixed:
    riskPerTradePercent: 0.5
    dailyLossLimitPercent: 2.0
    maxParallelTrades: 5

risk:
  deposit: 200000
  max_daily_loss_percent: 2.0
  risk_per_trade_percent: 0.5
  max_parallel_trades: 5

virtual:
  balance: 200000
