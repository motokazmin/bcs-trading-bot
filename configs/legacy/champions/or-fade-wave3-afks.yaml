# Champion — Opening Range Fade.
# Portfolio: configs/runs/portfolio-paper.yaml · docs/portfolio.md
trading_mode: virtual

tickers:
  - LKOH
  - CHMF
  - MOEX
  - AFKS

class_code: TQBR
candle_timeframe: M5

costs:
  commission_rate_per_leg: 0.00008
  # Проскальзывание + половина спреда на КАЖДОЙ ноге. 1 б.п. — консервативно-мягкая
  # оценка для ликвидных TQBR. Для стратегий со входом лимитом на уровне (ORC) вход
  # так оценивается с запасом: лимит не проскальзывает, он либо исполняется, либо нет.
  # Стресс без правки конфига: portfolio-backtest -slippage-bps N
  slippage_bps: 1

session:
  timezone: Europe/Moscow
  session_open_time: "10:00"
  eod_close_time: "18:40"
  entry_delay_minutes: 0

strategy:
  type: opening_range_fade
  stop_mode: atr
  atr_period: 14
  orb_minutes: 26
  breakout_threshold: 0.0034895165897401237
  fade_window_minutes: 52
  fade_trade_end_minutes: 106
  require_inside_range: false
  atr_multiplier: 1.2317886975190864
  reward_ratio: 1.2709535081206467
  trail_activation_r: 2.0039286981203337
  trail_breakeven_r: 0.017723090353826982
  trail_stage_max: 3
  max_trades_per_ticker_per_day: 2

  # Порог по стоимости сделки, не подгонка: комиссия 1.6 б.п. round-trip плюс
  # спред 1–5 б.п. Стоп в 20 б.п. — примерно 10x издержек. Ужесточать только
  # по новым данным (docs/analysis/state.md), а не по этим 95 сделкам.
  min_stop_bps: 20
risk:
  deposit: 200000
  max_daily_loss_percent: 2.0
  risk_per_trade_percent: 0.5
  max_parallel_trades: 2

virtual:
  balance: 200000
