# Paper trading: топ-10 ликвидных акций Мосбиржи
# Запуск: go run ./cmd/bot -config configs/virtual-multi.yaml

trading_mode: virtual

# Самые активные и "живые" тикеры на рынке акций (TQBR)
tickers:
  - SBER  # Сбербанк (Лидер рынка, идеален для тестов)
  - GAZP  # Газпром (Высокая ликвидность)
  - LKOH  # Лукойл (Огромные дневные обороты)
  - NVTK  # Новатэк (Техничный и волатильный)
  - YNDX  # Яндекс (Высокотехнологичный сектор, сильные внутридневные движения)
  - ROSN  # Роснефть (Плотный стакан)
  - MGNT  # Магнит (Высокий АТР/волатильность внутри дня)
  - CHMF  # Северсталь (Металлурги, часто ходят трендами)
  - TATN  # Татнефть (Стабильный поток ликвидности)
  - MOEX  # Сама Московская Биржа (Отличная внутридневная активность)

class_code: TQBR
candle_timeframe: M5

risk:
  deposit: 200000
  max_daily_loss: 4000            # Наш аварийный Circuit Breaker (2% от депо)
  risk_per_trade_percent: 0.5     # Рискуем строго 0.5% капитала в одной сделке

strategy:
  lookback: 20

virtual:
  balance: 200000

session:
  timezone: Europe/Moscow
  eod_close_time: "18:40"         # В 18:40 принудительно кроем по рынку (до вечерней сессии)
  session_open_time: "10:00"