class_code: TQBR
candle_timeframe: M5
# Глубина первичной загрузки, если CSV ещё нет
initial_history_years: 2

costs:
  commission_rate_per_leg: 0.00008  # 0,008% за leg (тариф БКС «Трейдер»)
  # Проскальзывание + половина спреда на КАЖДОЙ ноге. Поле обязано быть здесь:
  # costs.Config.SlippageBps по умолчанию 0, и без явной строки оптимизатор
  # подбирал бы параметры под идеальный фил, которого не бывает. Чувствительность
  # ~0.067R на б.п. — docs/analysis/0002-live-config-drift-and-cash-sizing.md
  slippage_bps: 1

# Lean universe для двухфазного поиска (-two-phase)
