# Все запланированные A/B-опыты в одном процессе
# 3 эксперимента, 16 воркеров (3+3+10), один WebSocket
#
#   atr-2-lean   — ATR×2, lean universe (SBER, ROSN, NVTK), вход с 10:00
#   atr-1-lean   — ATR×1, lean universe, вход с 10:00
#   atr-2-delayed — ATR×2, полный universe, вход с 10:30 (entry_delay 30)
#
# Запуск: go run ./cmd/bot -config configs/experiments-all.yaml

trading_mode: virtual

tickers:
  - SBER
  - GAZP
  - LKOH
  - NVTK
  - YNDX
  - ROSN
  - MGNT
  - CHMF
  - TATN
  - MOEX

class_code: TQBR
candle_timeframe: M5

session:
  timezone: Europe/Moscow
  eod_close_time: "18:40"
  session_open_time: "10:00"

storage:
  path: data/trades.db

experiments:
  - id: atr-2-lean
    name: "ATR × 2.0 — lean universe"
    tickers:
      - SBER
      - ROSN
      - NVTK
    entry_delay_minutes: 0
    strategy:
      lookback: 20
      stop_mode: atr
      atr_period: 14
      atr_multiplier: 2.0
    risk:
      deposit: 200000
      max_daily_loss: 4000
      risk_per_trade_percent: 0.5
    virtual:
      balance: 200000

  - id: atr-1-lean
    name: "ATR × 1.0 — lean universe"
    tickers:
      - SBER
      - ROSN
      - NVTK
    entry_delay_minutes: 0
    strategy:
      lookback: 20
      stop_mode: atr
      atr_period: 14
      atr_multiplier: 1.0
    risk:
      deposit: 200000
      max_daily_loss: 4000
      risk_per_trade_percent: 0.5
    virtual:
      balance: 200000

  - id: atr-2-delayed
    name: "ATR × 2.0 — полный universe, вход с 10:30"
    entry_delay_minutes: 30
    strategy:
      lookback: 20
      stop_mode: atr
      atr_period: 14
      atr_multiplier: 2.0
    risk:
      deposit: 200000
      max_daily_loss: 4000
      risk_per_trade_percent: 0.5
    virtual:
      balance: 200000
