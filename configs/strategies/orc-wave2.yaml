# ORC wave 2 — узкий search вокруг best-config wave1 (focus 2026-07-10).
# Якорь: orb=16, atr≈1.0, RR≈1.65, breakout≈0.9%, trail≈1.9R.
trading_mode: virtual

tickers:
  - ticker: SBER
    step_price_value: 1.0
  - ticker: MGNT
    step_price_value: 1.0
  - ticker: ROSN
    step_price_value: 1.0
  - ticker: TATN
    step_price_value: 1.0

class_code: TQBR
candle_timeframe: M5

costs:
  commission_per_lot: 0.10

session:
  timezone: Europe/Moscow
  session_open_time: "10:00"
  eod_close_time: "18:40"
  entry_delay_minutes: 0

strategy:
  type: opening_range_continuation
  stop_mode: atr
  atr_period: 14
  atr_multiplier: 1.01
  orb_minutes: 16
  breakout_threshold: 0.009
  reward_ratio: 1.65
  trail_activation_r: 1.91
  trail_stage_max: 2
  trail_breakeven_r: 0.065
  max_trades_per_ticker_per_day: 2

search_space:
  strategy: opening_range_continuation
  parameters:
    orbMinutes:
      type: int
      min: 12
      max: 22
    breakoutThreshold:
      type: float
      min: 0.003
      max: 0.015
    rewardRatio:
      type: float
      min: 1.3
      max: 2.0
    atrMultiplier:
      type: float
      min: 0.8
      max: 1.3
    trailActivationR:
      type: float
      min: 1.5
      max: 2.2
    trailStageMax:
      type: int
      min: 1
      max: 2
    trailBreakevenR:
      type: float
      min: 0.0
      max: 0.15
    maxEntriesPerTickerPerDay:
      type: int
      min: 1
      max: 3
  fixed:
    riskPerTradePercent: 0.5
    dailyLossLimitPercent: 2.0
    maxParallelTrades: 2

risk:
  deposit: 200000
  max_daily_loss_percent: 2.0
  risk_per_trade_percent: 0.5
  max_parallel_trades: 2

virtual:
  balance: 200000

storage:
  enabled: true
  path: data/trades-orc.db
