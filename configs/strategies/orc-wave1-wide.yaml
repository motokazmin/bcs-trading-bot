# ORC wave 1 — широкий search (как focus-прогон 2026-07-10, 200 trials).
# Сохранён для повторяемости; новые прогоны — orc.yaml / orc-wave2.yaml.
trading_mode: virtual

tickers:
  - ticker: SBER
    step_price_value: 1.0
  - ticker: MGNT
    step_price_value: 1.0
  - ticker: ROSN
    step_price_value: 1.0
  - ticker: TATN
    step_price_value: 1.0

class_code: TQBR
candle_timeframe: M5

costs:
  commission_rate_per_leg: 0.00008

session:
  timezone: Europe/Moscow
  session_open_time: "10:00"
  eod_close_time: "18:40"
  entry_delay_minutes: 0

strategy:
  type: opening_range_continuation
  stop_mode: atr
  atr_period: 14
  atr_multiplier: 2.0
  orb_minutes: 30
  breakout_threshold: 0.0
  reward_ratio: 2.60
  trail_activation_r: 1.5
  trail_stage_max: 1
  trail_breakeven_r: 0.1
  max_trades_per_ticker_per_day: 3

search_space:
  strategy: opening_range_continuation
  parameters:
    orbMinutes:
      type: int
      min: 15
      max: 45
    breakoutThreshold:
      type: float
      min: 0.0
      max: 0.02
    rewardRatio:
      type: float
      min: 1.5
      max: 3.0
    atrMultiplier:
      type: float
      min: 1.0
      max: 3.0
    trailActivationR:
      type: float
      min: 1.0
      max: 2.0
    trailStageMax:
      type: int
      min: 1
      max: 2
    trailBreakevenR:
      type: float
      min: 0.0
      max: 0.2
    maxEntriesPerTickerPerDay:
      type: int
      min: 1
      max: 3
  fixed:
    riskPerTradePercent: 0.5
    dailyLossLimitPercent: 2.0
    maxParallelTrades: 2

risk:
  deposit: 200000
  max_daily_loss_percent: 2.0
  risk_per_trade_percent: 0.5
  max_parallel_trades: 2

virtual:
  balance: 200000

storage:
  enabled: true
  path: data/trades-orc.db
