# Переподбор блока ВЫХОДА слота or-fade-conservative (opening_range_fade).
# Вход зафиксирован текущими значениями — иначе результат нельзя отнести
# к выходу. trailActivationR — доля от тейка (`of`), поэтому трейл
# достижим по построению. Протокол: docs/analysis/0003-*.
trading_mode: virtual
class_code: TQBR
candle_timeframe: M5
session:
  timezone: Europe/Moscow
  session_open_time: '10:00'
  eod_close_time: '18:40'
  entry_delay_minutes: 0
strategy:
  type: opening_range_fade
  stop_mode: atr
search_space:
  strategy: opening_range_fade
  parameters:
    rewardRatio:
      type: float
      min: 1.0
      max: 3.0
    trailActivationR:
      type: float
      min: 0.2
      max: 0.95
      of: rewardRatio
    trailBreakevenR:
      type: float
      min: 0.0
      max: 0.2
    trailStageMax:
      type: int
      min: 1
      max: 4
  fixed:
    atrPeriod: 14
    orbMinutes: 26
    breakoutThreshold: 0.0034895165897401237
    fadeWindowMinutes: 52
    fadeTradeEndMinutes: 106
    requireInsideRange: 0
    atrMultiplier: 1.2317886975190864
    maxEntriesPerTickerPerDay: 2
    minStopBps: 20
    riskPerTradePercent: 0.2
    dailyLossLimitPercent: 2.0
    maxParallelTrades: 5
    takeProfitEnabled: 1
risk:
  deposit: 200000
  max_daily_loss_percent: 2.0
  risk_per_trade_percent: 0.2
  max_parallel_trades: 5
virtual:
  balance: 200000
