# Momentum SBER day-trend — afternoon slot, только SBER, фильтр дневного тренда.
trading_mode: virtual

tickers:
  - ticker: SBER
    step_price_value: 1.0

class_code: TQBR
candle_timeframe: M5

costs:
  commission_rate_per_leg: 0.00008

session:
  timezone: Europe/Moscow
  session_open_time: "10:00"
  eod_close_time: "18:40"
  entry_delay_minutes: 0

strategy:
  type: momentum_sber_daytrend
  stop_mode: atr
  lookback: 20
  breakout_threshold: 0.01
  reward_ratio: 2.0
  volume_filter: true
  volume_min_ratio: 1.5
  long_only: false
  strategy_entry_delay_minutes: 150
  atr_multiplier: 2.0
  max_trades_per_ticker_per_day: 3

search_space:
  strategy: momentum_sber_daytrend
  parameters:
    lookback:
      type: int
      min: 10
      max: 40
    breakoutThreshold:
      type: float
      min: 0.0
      max: 0.05
    rewardRatio:
      type: float
      min: 1.0
      max: 3.0
    volumeFilter:
      type: int
      min: 0
      max: 1
    volumeFilterMultiplier:
      type: float
      min: 1.0
      max: 3.0
    longOnly:
      type: int
      min: 0
      max: 1
    strategyEntryDelayMinutes:
      type: int
      min: 120
      max: 180
    atrMultiplier:
      type: float
      min: 1.0
      max: 3.0
    trailActivationR:
      type: float
      min: 1.0
      max: 3.0
    trailStageMax:
      type: int
      min: 1
      max: 5
    maxEntriesPerTickerPerDay:
      type: int
      min: 1
      max: 5
  fixed:
    riskPerTradePercent: 0.5
    dailyLossLimitPercent: 2.0

risk:
  deposit: 200000
  max_daily_loss_percent: 2.0
  risk_per_trade_percent: 0.5
  max_parallel_trades: 2

virtual:
  balance: 200000

storage:
  enabled: true
  path: data/trades-momentum-sber-daytrend.db
