# Регистрация: docs/analysis/0014-m15-champion-search.md. Не править после прогона.
# Подбор 2024-10-04 → 2026-03-31, хвост 2026-04-01 → 2026-10-02 оптимизатор не видит.
# Минуты — шагом 15 (сетка M15), бары — пересчитаны по времени с M5.
candle_timeframe: M15

session:
  timezone: Europe/Moscow
  session_open_time: "10:00"
  eod_close_time: "18:40"
  entry_delay_minutes: 150

search_space:
  strategy: momentum_filtered
  parameters:
    # Бары: 10…40 на M5 → 4…14 на M15 по времени.
    lookback:               {type: int, min: 4, max: 14}
    trendSMAPeriod:         {type: int, min: 0, max: 17}
    breakoutThreshold:      {type: float, min: 0.0, max: 0.02}
    volumeFilter:           {type: int, min: 0, max: 1}
    volumeFilterMultiplier: {type: float, min: 1.0, max: 3.0}
    strategyEntryDelayMinutes: {type: int, min: 0, max: 30, step: 15}
    atrMultiplier:          {type: float, min: 1.0, max: 3.0}
    trailDiscreteStepR:     {type: float, min: 0.25, max: 1.0}
    maxEntriesPerTickerPerDay: {type: int, min: 1, max: 3}
    rewardRatio:            {type: float, min: 1.0, max: 2.2}
    # Доля тейка: трейл включается раньше тейка по построению (0003).
    trailActivationR:       {type: float, min: 0.25, max: 0.95, of: rewardRatio}
    trailStageMax:          {type: int, min: 1, max: 3}
    trailBreakevenR:        {type: float, min: 0.0, max: 0.15}
    # ATR в барах: на M15 14 баров = 3.5 ч. 5 баров ≈ 14 баров M5 по времени.
    atrPeriod:              {type: int, min: 4, max: 14}
  fixed:
    minStopBps: 20
    riskPerTradePercent: 0.20
    dailyLossLimitPercent: 2.0
    maxParallelTrades: 5
    longOnly: 1
