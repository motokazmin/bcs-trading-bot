# OR Fade wave2 — узкий search вокруг wave1 best (2026-07-10).
# Якорь: orb=11, breakout≈0.005, fade_window≈44, fade_end≈138, atr≈0.95, RR≈1.77.
trading_mode: virtual

tickers:
  - ticker: MGNT
    step_price_value: 1.0
  - ticker: ROSN
    step_price_value: 1.0
  - ticker: TATN
    step_price_value: 1.0

class_code: TQBR
candle_timeframe: M5

costs:
  commission_rate_per_leg: 0.00008

session:
  timezone: Europe/Moscow
  session_open_time: "10:00"
  eod_close_time: "18:40"
  entry_delay_minutes: 0

strategy:
  type: opening_range_fade
  stop_mode: atr
  atr_period: 14
  atr_multiplier: 0.95
  orb_minutes: 11
  breakout_threshold: 0.005
  fade_window_minutes: 44
  fade_trade_end_minutes: 138
  require_inside_range: false
  reward_ratio: 1.77
  trail_activation_r: 1.5
  trail_stage_max: 2
  trail_breakeven_r: 0.05
  max_trades_per_ticker_per_day: 2

search_space:
  strategy: opening_range_fade
  parameters:
    orbMinutes:
      type: int
      min: 8
      max: 14
    breakoutThreshold:
      type: float
      min: 0.002
      max: 0.01
    fadeWindowMinutes:
      type: int
      min: 30
      max: 60
    fadeTradeEndMinutes:
      type: int
      min: 120
      max: 150
    requireInsideRange:
      type: int
      min: 0
      max: 1
    rewardRatio:
      type: float
      min: 1.4
      max: 2.0
    atrMultiplier:
      type: float
      min: 0.7
      max: 1.2
    trailActivationR:
      type: float
      min: 1.0
      max: 2.5
    trailStageMax:
      type: int
      min: 1
      max: 3
    trailBreakevenR:
      type: float
      min: 0.0
      max: 0.15
    maxEntriesPerTickerPerDay:
      type: int
      min: 1
      max: 3
  fixed:
    riskPerTradePercent: 0.5
    dailyLossLimitPercent: 2.0
    maxParallelTrades: 2

risk:
  deposit: 200000
  max_daily_loss_percent: 2.0
  risk_per_trade_percent: 0.5
  max_parallel_trades: 2

virtual:
  balance: 200000

storage:
  enabled: true
  path: data/trades-or-fade.db
