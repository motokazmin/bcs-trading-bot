# Конфигурация стратегии Opening Range Continuation (ORC)
trading_mode: virtual

tickers:
  - ticker: SBER
    step_price_value: 1.0
  - ticker: MGNT
    step_price_value: 1.0
  - ticker: ROSN
    step_price_value: 1.0
  - ticker: TATN
    step_price_value: 1.0

class_code: TQBR
candle_timeframe: M5

costs:
  commission_per_lot: 0.10

session:
  timezone: Europe/Moscow
  session_open_time: "10:00"
  eod_close_time: "18:40"
  entry_delay_minutes: 0

strategy:
  type: opening_range_continuation
  stop_mode: atr
  atr_period: 14
  atr_multiplier: 2.0
  orb_minutes: 30
  breakout_threshold: 0.0
  reward_ratio: 2.60
  trail_activation_r: 1.5
  trail_stage_max: 1
  trail_breakeven_r: 0.1
  max_trades_per_ticker_per_day: 3

search_space:
  strategy: opening_range_continuation
  parameters:
    orbMinutes:
      type: int
      min: 30
      max: 30
    breakoutThreshold:
      type: float
      min: 0.0
      max: 0.0
    rewardRatio:
      type: float
      min: 2.60
      max: 2.60
    atrMultiplier:
      type: float
      min: 1.0
      max: 3.0
    trailActivationR:
      type: float
      min: 1.5
      max: 1.5
    trailStageMax:
      type: int
      min: 1
      max: 1
    trailBreakevenR:
      type: float
      min: 0.1
      max: 0.1
    maxEntriesPerTickerPerDay:
      type: int
      min: 1
      max: 3
  fixed:
    riskPerTradePercent: 0.5
    dailyLossLimitPercent: 2.0
    maxParallelTrades: 2

risk:
  deposit: 200000
  max_daily_loss_percent: 2.0
  risk_per_trade_percent: 0.5
  max_parallel_trades: 2

virtual:
  balance: 200000

storage:
  enabled: true
  path: data/trades-orc.db
