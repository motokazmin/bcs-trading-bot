strategy: mean_reversion
parameters:
  lookback:
    type: int
    min: 10
    max: 60
  fadeThreshold:
    type: float
    min: 0.005
    max: 0.05
  rewardRatio:
    type: float
    min: 1.0
    max: 2.0
  atrMultiplier:
    type: float
    min: 1.0
    max: 3.0
  volumeFilter:
    type: int
    min: 0
    max: 1
  volumeFilterMultiplier:
    type: float
    min: 1.0
    max: 3.0
  trailActivationR:
    type: float
    min: 1.0
    max: 3.0
  trailDiscreteStepR:
    type: float
    min: 0.25
    max: 1.0
  trailStageMax:
    type: int
    min: 1
    max: 5
  maxEntriesPerTickerPerDay:
    type: int
    min: 1
    max: 5

fixed:
  riskPerTradePercent: 0.5
  dailyLossLimitPercent: 2.0
